name: connectors-check
on:
  push:
    branches: [ci-8573]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p fedimint-connectors --check
      - run: cargo clippy -p fedimint-connectors --all-targets --no-deps -- -D warnings
